[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gift-tracking"
version = "0.1.0"
description = "Telegram collectible gift monitor with bot notifications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Telethon>=1.44,<2",
]

[project.scripts]
gift-tracking = "gift_tracking.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

